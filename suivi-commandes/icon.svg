<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Fond avec coins arrondis -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <g filter="url(#shadow)">
    <!-- Colis / Boite de livraison -->
    <path d="M256 120 L380 185 L256 250 L132 185 Z" fill="#93c5fd" opacity="0.9" />
    <path d="M132 185 L256 250 L256 390 L132 325 Z" fill="#2563eb" />
    <path d="M380 185 L256 250 L256 390 L380 325 Z" fill="#1d4ed8" />
    <!-- Ruban adhésif -->
    <path d="M228 135 L284 165 L284 235 L228 205 Z" fill="#f8fafc" opacity="0.35" />
    
    <!-- Horloge / Alarme circulaire superposée -->
    <circle cx="370" cy="370" r="95" fill="#0f172a" stroke="#38bdf8" stroke-width="12" />
    <circle cx="370" cy="370" r="82" fill="#1e293b" />
    <!-- Aiguilles horloge -->
    <line x1="370" y1="370" x2="370" y2="315" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" />
    <line x1="370" y1="370" x2="415" y2="370" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <circle cx="370" cy="370" r="10" fill="#f59e0b" />
    
    <!-- Éclair vitesse / rappel -->
    <path d="M175 140 L135 220 L165 220 L140 290 L210 200 L180 200 Z" fill="url(#accentGrad)" opacity="0.9" />
  </g>
</svg>
